services:
  # ------------------------------------------keyservice: 2 stateless replicas
  keyservice:
    build: ./keyservice
    deploy:
      replicas: 2
    expose:
      - "8080"
    environment:
      DATABASE_URL: "postgres://mint:mint_dev@postgres:5432/mint?sslmode=disable"
      ADMIN_TOKEN: "just-works-for-now" #reminder to use secret manager
      KEY_PEPPER: "dev-pepper-rotate-in-prod"
      REDIS_URL: "redis://redis:6379/0" #schema://host:port:dotabase number
      PREWARM_LIMIT: "${PREWARM_LIMIT:-1000}"
      RATE_LIMIT: "${RATE_LIMIT:-100}"
      RATE_BURST: "${RATE_BURST:-200}"
      FLUSH_INTERVAL: "${FLUSH_INTERVAL:-30s}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  #---------------------------migrate: one-shot, runs schema migrations then exits
  migrate:
    image: migrate/migrate:v4.17.1@sha256:9567411804cda973cfc8005ce0805d0d80129c54e4be28bbf46f259396e34cc9
    volumes:
      - ./keyservice/migrations:/migrations:ro
    command:
      - "-path"
      - "/migrations"
      - "-database"
      - "postgres://mint:mint_dev@postgres:5432/mint?sslmode=disable"
      - up

    depends_on:
      postgres:
        condition: service_healthy
    restart:
      "no"
      #------------------------------nginx:load balancer + entry point
  nginx:
    build:
      context: ./infra
      dockerfile: nginx.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - keyservice

  #-------------------------------------postgres:
  postgres:
    image: postgres:16-alpine@sha256:0fc5c901ec0a3c55ce70b99b040daeb89d5b35b61febbced1b4b24dbc3153ec8
    environment:
      POSTGRES_USER: mint
      POSTGRES_PASSWORD: mint_dev
      POSTGRES_DB: mint
    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mint -d mint"]
      interval: 5s
      timeout: 3s
      retries: 10

  #-----------------------------------------redis: cache +  counter + rate-limit state-----------------
  redis:
    image: redis:7-alpine@sha256:b1addbe72465a718643cff9e60a58e6df1841e29d6d7d60c9a85d8d72f08d1a7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  #------- Promethus
  prometheus:
    image: prom/prometheus:v2.54.1@sha256:69961df6ffa67598048a31aa2822d61f3c93b91d7db24e44d9bb03f99d520da9
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/rules.yml:/etc/prometheus/rules.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - keyservice

  #---------------grafana
  grafana:
    image: grafana/grafana:11.2.0@sha256:37a5d8860aef847dfa09f5f8947f010f6479f98cf7820b5186f9c6314b44be60
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true" # no login wall for the demo
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # ----- demo product: a downstream service that authenticates via Mint -----
  demo:
    build:
      context: .
      dockerfile: demo/Dockerfile
    environment:
      MINT_URL: "http://nginx:80"   # reach Mint through its load balancer
      LISTEN_ADDR: ":9000"
    ports:
      - "9000:9000"
    depends_on:
      - nginx

volumes:
  postgres_data:
  redis_data:
