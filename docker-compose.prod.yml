# Production TLS overlay — layer on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Prerequisites: generate certs into infra/tls/ (see infra/tls/README.md).

services:
  keyservice:
    environment:
      # Postgres: verify the server's certificate against our CA.
      DATABASE_URL: "postgres://mint:${POSTGRES_PASSWORD}@postgres:5432/mint?sslmode=verify-ca&sslrootcert=/certs/ca.crt"
      # Redis: TLS-encrypted connection.
      REDIS_URL: "rediss://redis:6379/0"
      # Override dev placeholders — set these via .env or a secret manager.
      ADMIN_TOKEN: "${ADMIN_TOKEN}"
      KEY_PEPPER: "${KEY_PEPPER}"
    volumes:
      - ./infra/tls/ca.crt:/certs/ca.crt:ro

  migrate:
    command:
      - "-path"
      - "/migrations"
      - "-database"
      - "postgres://mint:${POSTGRES_PASSWORD}@postgres:5432/mint?sslmode=verify-ca&sslrootcert=/certs/ca.crt"
      - "up"
    volumes:
      - ./infra/tls/ca.crt:/certs/ca.crt:ro

  postgres:
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    command:
      - "postgres"
      - "-c"
      - "ssl=on"
      - "-c"
      - "ssl_cert_file=/certs/server.crt"
      - "-c"
      - "ssl_key_file=/certs/server.key"
      - "-c"
      - "ssl_ca_file=/certs/ca.crt"
    volumes:
      - ./infra/tls/server.crt:/certs/server.crt:ro
      - ./infra/tls/server.key:/certs/server.key:ro
      - ./infra/tls/ca.crt:/certs/ca.crt:ro
    # Don't expose Postgres to the host in production.
    ports: !reset []

  redis:
    command:
      - "redis-server"
      - "--tls-port"
      - "6379"
      - "--port"
      - "0"
      - "--tls-cert-file"
      - "/certs/server.crt"
      - "--tls-key-file"
      - "/certs/server.key"
      - "--tls-ca-cert-file"
      - "/certs/ca.crt"
    volumes:
      - ./infra/tls/server.crt:/certs/server.crt:ro
      - ./infra/tls/server.key:/certs/server.key:ro
      - ./infra/tls/ca.crt:/certs/ca.crt:ro
    healthcheck:
      test: ["CMD", "redis-cli", "--tls", "--cacert", "/certs/ca.crt", "ping"]
    # Don't expose Redis to the host in production.
    ports: !reset []

  grafana:
    environment:
      # Disable anonymous access in production.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
